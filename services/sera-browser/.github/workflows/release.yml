name: Release

# Triggered when a version tag (v3.1.0, v3.2.0, etc.) is pushed.
# Builds the wheel + sdist, runs tests, and publishes to:
#   1. PyPI (public, via Trusted Publishing/OIDC — no stored tokens)
#   2. GitHub Release (artifacts attached to the tag)
#
# PyPI Trusted Publishing configuration:
#   PyPI project name: sera-browser
#   Owner: mir-ashiq
#   Repository: sera-browser
#   Workflow: release.yml
#   Environment: pypi
#
# The GitHub repository is PRIVATE, but the PyPI package is PUBLIC.
# Trusted Publishing works with private repos — the source code stays
# private, but the published wheel is publicly installable via:
#   pip install sera-browser

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # to create GitHub Releases + upload artifacts
  id-token: write  # for PyPI Trusted Publishing (OIDC)

jobs:
  test:
    name: Run tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run tests
        run: |
          pytest tests/ -q \
            --ignore=tests/test_juice_shop.py \
            --tb=short

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Validate package metadata
        run: |
          twine check dist/*
          echo "--- METADATA ---"
          WHL=$(ls dist/*.whl)
          python -c "
          import zipfile, json
          z = zipfile.ZipFile('$WHL')
          meta = {}
          for line in z.read([n for n in z.namelist() if n.endswith('METADATA')][0]).decode().splitlines():
            if ':' in line and not line.startswith(' '):
              k, _, v = line.partition(':')
              meta[k.strip()] = v.strip()
          print(json.dumps({k: meta[k] for k in ['Name','Version','Requires-Python','License','Summary']}, indent=2))
          "

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import zipfile; z=zipfile.ZipFile('$(ls dist/*.whl)'); m=[l for l in z.read([n for n in z.namelist() if n.endswith('METADATA')][0]).decode().splitlines() if l.startswith('Version:')][0]; print(m.split(':')[1].strip())")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version alignment OK"

      - name: Generate checksums
        run: |
          cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/sera-browser

    permissions:
      id-token: write  # OIDC Trusted Publishing — no stored tokens

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Remove non-package files from dist
        run: rm -f dist/checksums.txt

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release-github:
    name: Create GitHub Release with artifacts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt
          body: |
            ## sera-browser ${{ github.ref_name }}

            ### Installation

            ```bash
            pip install sera-browser
            ```

            Or upgrade:

            ```bash
            pip install --upgrade sera-browser
            ```

            ### Checksums

            See `checksums.txt` for SHA-256 hashes of the wheel and sdist.
