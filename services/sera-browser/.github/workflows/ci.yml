name: CI

on:
  push:
    branches: [main, rebuild/browser-intelligence-v4]
  pull_request:
    branches: [main, rebuild/browser-intelligence-v4]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run unit tests (excluding Juice Shop + slow)
        run: |
          pytest tests/ -q \
            --ignore=tests/test_juice_shop.py \
            -m "not slow" \
            --tb=short \
            --cov=sera_browser \
            --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Validate package metadata
        run: |
          twine check dist/*
          echo "--- METADATA ---"
          WHL=$(ls dist/*.whl)
          python -c "
          import zipfile, json
          z = zipfile.ZipFile('$WHL')
          meta = {}
          for line in z.read([n for n in z.namelist() if n.endswith('METADATA')][0]).decode().splitlines():
            if ':' in line and not line.startswith(' '):
              k, _, v = line.partition(':')
              meta[k.strip()] = v.strip()
          print(json.dumps({k: meta[k] for k in ['Name','Version','Requires-Python','License','Summary']}, indent=2))
          "

      - name: Generate checksums
        run: |
          cd dist && sha256sum * > checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  wheel-install-test:
    name: Clean-env wheel installation test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create clean venv + install wheel
        run: |
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install --upgrade pip
          WHL=$(ls dist/*.whl)
          echo "Installing: $WHL"
          /tmp/clean-venv/bin/pip install "$WHL"

      - name: Verify public API
        run: |
          /tmp/clean-venv/bin/python -c "
          import sera_browser
          assert len(sera_browser.__all__) >= 80, f'too few exports: {len(sera_browser.__all__)}'
          from sera_browser import (
              BrowserAgent, SessionManager, Settings, create_app,
              BrowserViewer, HistoryManager, SoftRestrict, SafetyGuard,
              make_llm_client, LLMConfig, MockLLMClient,
              TaskCreate, AgentReport, BrowserState,
              PlaywrightDriver, Inspector, ElementResolver,
              TabManager, StealthLayer, SetOfMarkAnnotator,
              PlanActValidateOrchestrator, MemoryManager,
              NetworkRecorder, ChallengeDetector,
          )
          print(f'sera-browser {sera_browser.__version__} — {len(sera_browser.__all__)} public exports OK')
          "
