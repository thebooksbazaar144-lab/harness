[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sera-browser"
version = "4.0.0"
description = "Standalone Playwright-first autonomous browser agent for SERA — provider-agnostic LLM planner, real-view human-takeoverable browser, CDP AX tree, multi-tab, stealth, history/replay, structured extraction."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "mir-ashiq", email = "imsrenpsycho@gmail.com" }
]
maintainers = [
  { name = "mir-ashiq", email = "imsrenpsycho@gmail.com" }
]
keywords = [
  "playwright",
  "browser-automation",
  "agent",
  "sera",
  "security",
  "llm",
  "cdp",
  "accessibility",
  "autonomous",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "playwright>=1.57",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "anyio>=4.3",
  "tenacity>=8.2",
]

[project.optional-dependencies]
# Optional: browser-use fallback driver for difficult visual interactions.
fallback = [
  "browser-use>=0.1.30",
]
# Optional: vision escalation (Set-of-Mark screenshot annotation).
vision = [
  "Pillow>=10.0",
]
# Development + testing dependencies.
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "pytest-cov>=4",
  "httpx>=0.27",
  "trio>=0.25",
  "build>=1.0",
  "twine>=4.0",
]
# Alias for backward compatibility.
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "pytest-cov>=4",
  "httpx>=0.27",
  "trio>=0.25",
]

[project.scripts]
sera-browser = "sera_browser.__main__:main"
sera-browser-agent = "sera_browser.__main__:main"

[project.urls]
Homepage = "https://github.com/mir-ashiq/sera-browser"
Repository = "https://github.com/mir-ashiq/sera-browser"
Issues = "https://github.com/mir-ashiq/sera-browser/issues"
Documentation = "https://github.com/mir-ashiq/sera-browser/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sera_browser = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "juice_shop: tests requiring OWASP Juice Shop to be running",
  "slow: tests that take more than 10 seconds",
]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:playwright.*",
]

[tool.coverage.run]
source = ["sera_browser"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "pass",
  "if TYPE_CHECKING:",
]
